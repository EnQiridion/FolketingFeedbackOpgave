<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folketing Medlemmer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛️ Folketing Medlemmer</h1>
            <p>Administration af folketingsmedlemmer</p>
        </header>

        <!-- Formular til at oprette nyt medlem -->
        <section class="form-section">
            <h2>Tilføj nyt medlem</h2>
            <form id="personForm">
                <div class="form-group">
                    <label for="name">Navn:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="party">Parti:</label>
                    <select id="party" name="party" required>
                        <option value="">Vælg parti...</option>
                        <option value="Socialdemokratiet">Socialdemokratiet</option>
                        <option value="Venstre">Venstre</option>
                        <option value="Moderaterne">Moderaterne</option>
                        <option value="SF">SF</option>
                        <option value="Danmarksdemokraterne">Danmarksdemokraterne</option>
                        <option value="Liberal Alliance">Liberal Alliance</option>
                        <option value="Enhedslisten">Enhedslisten</option>
                        <option value="Det Konservative Folkeparti">Det Konservative Folkeparti</option>
                        <option value="Nye Borgerlige">Nye Borgerlige</option>
                        <option value="Alternativet">Alternativet</option>
                        <option value="Dansk Folkeparti">Dansk Folkeparti</option>
                        <option value="Radikale Venstre">Radikale Venstre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="position">Position:</label>
                    <select id="position" name="position" required>
                        <option value="">Vælg position...</option>
                        <option value="Minister">Minister</option>
                        <option value="Formand">Formand</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="post">Post (valgfrit):</label>
                    <input type="text" id="post" name="post">
                </div>

                <button type="submit" class="btn btn-primary">Tilføj medlem</button>
                <button type="button" class="btn btn-secondary" onclick="clearForm()">Ryd formular</button>
            </form>
        </section>

        <!-- Liste over medlemmer -->
        <section class="members-section">
            <div class="section-header">
                <h2>Alle medlemmer</h2>
                <button class="btn btn-refresh" onclick="loadPersons()">🔄 Opdater</button>
            </div>
            <div id="membersList" class="members-list">
                <p class="loading">Indlæser medlemmer...</p>
            </div>
        </section>

        <!-- Modal til redigering -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2>Rediger medlem</h2>
                <form id="editForm">
                    <input type="hidden" id="editId">
                    
                    <div class="form-group">
                        <label for="editName">Navn:</label>
                        <input type="text" id="editName" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="editParty">Parti:</label>
                        <select id="editParty" name="party" required>
                            <option value="Socialdemokratiet">Socialdemokratiet</option>
                            <option value="Venstre">Venstre</option>
                            <option value="Moderaterne">Moderaterne</option>
                            <option value="SF">SF</option>
                            <option value="Danmarksdemokraterne">Danmarksdemokraterne</option>
                            <option value="Liberal Alliance">Liberal Alliance</option>
                            <option value="Enhedslisten">Enhedslisten</option>
                            <option value="Det Konservative Folkeparti">Det Konservative Folkeparti</option>
                            <option value="Nye Borgerlige">Nye Borgerlige</option>
                            <option value="Alternativet">Alternativet</option>
                            <option value="Dansk Folkeparti">Dansk Folkeparti</option>
                            <option value="Radikale Venstre">Radikale Venstre</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editPosition">Position:</label>
                        <select id="editPosition" name="position" required>
                            <option value="Minister">Minister</option>
                            <option value="Formand">Formand</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editPost">Post:</label>
                        <input type="text" id="editPost" name="post">
                    </div>

                    <button type="submit" class="btn btn-primary">Gem ændringer</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Annuller</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
